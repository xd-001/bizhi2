name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (with icon if exists)
        shell: pwsh
        run: |
          if (Test-Path "icon.ico") {
            pyinstaller --onefile --windowed --icon=icon.ico --name="WallpaperChanger" src/main.py
          } else {
            pyinstaller --onefile --windowed --name="WallpaperChanger" src/main.py
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperChanger
          path: dist/WallpaperChanger.exe
